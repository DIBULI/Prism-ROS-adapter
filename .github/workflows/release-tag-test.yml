name: ROS release tag test

on:
  push:
    branches:
      - master
      - codex/ros-adapter-1.2.0
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  # Hosted runners can pull Docker Hub directly; dependency packages still
  # use the Tsinghua mirrors configured in the Dockerfiles.
  PRISM_DOCKER_MIRROR: docker.io/library
  PRISM_DOCKER_PULL_TIMEOUT_SECONDS: "90"

concurrency:
  group: ros-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  common-test:
    name: Common tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          mapfile -t package_versions < <(
            sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' \
              ros1_ws/src/prism_ros_driver/package.xml \
              ros1_ws/src/prism_ros_msgs/package.xml \
              ros2_ws/src/prism_ros_driver/package.xml \
              ros2_ws/src/prism_ros_msgs/package.xml
          )
          test "${#package_versions[@]}" -eq 4
          for package_version in "${package_versions[@]}"; do
            test "${package_version}" = "${tag_version}" || {
              echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}" >&2
              exit 1
            }
          done

      - name: Check shell scripts
        shell: bash
        run: for script in scripts/*.sh docker/*.sh; do bash -n "$script"; done

      - name: Verify pinned release metadata
        run: |
          test "$(cat VERSION)" = 1.2.0
          test "$(git -C third_party/Prism-SDK rev-parse HEAD)" = 1e7d6f756887be45c406209b3cd46e90d11bdeae
          test "$(cat third_party/Prism-SDK/VERSION)" = "$(cat VERSION)"

      - name: Verify Prism SDK submodule
        run: bash scripts/verify_sdk_submodule.sh all

      - name: Configure common tests
        run: cmake -S . -B build-common -DBUILD_TESTING=ON

      - name: Build common tests
        run: cmake --build build-common --parallel

      - name: Run common tests
        run: ctest --test-dir build-common --output-on-failure

  ros-build:
    name: x86-64 ${{ matrix.generation }} ${{ matrix.distro }}
    needs: common-test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - generation: ROS 1
            distro: noetic
          - generation: ROS 2
            distro: foxy
          - generation: ROS 2
            distro: humble
          - generation: ROS 2
            distro: jazzy
          - generation: ROS 2
            distro: kilted
          - generation: ROS 2
            distro: lyrical
          - generation: ROS 2
            distro: rolling
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify ${{ matrix.distro }} SDK runtime
        run: bash scripts/verify_sdk_submodule.sh "${{ matrix.distro }}"

      - name: Build ${{ matrix.distro }} container
        env:
          DOCKER_BUILDKIT: "1"
        run: ./scripts/docker_build.sh "${{ matrix.distro }}"

      - name: Smoke-test ${{ matrix.distro }} container
        run: ./scripts/docker_smoke_test.sh "${{ matrix.distro }}"

  ros-arm64-build:
    name: ARM64 ${{ matrix.generation }} ${{ matrix.distro }}
    needs: common-test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - generation: ROS 1
            distro: noetic
          - generation: ROS 2
            distro: foxy
          - generation: ROS 2
            distro: humble
          - generation: ROS 2
            distro: jazzy
          - generation: ROS 2
            distro: kilted
          - generation: ROS 2
            distro: lyrical
          - generation: ROS 2
            distro: rolling
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify native ARM64 runner
        run: test "$(uname -m)" = aarch64

      - name: Verify ${{ matrix.distro }} ARM64 SDK runtime
        env:
          PRISM_ROS_ARCH: arm64
        run: bash scripts/verify_sdk_submodule.sh "${{ matrix.distro }}"

      - name: Build ${{ matrix.distro }} ARM64 container
        env:
          DOCKER_BUILDKIT: "1"
          PRISM_ROS_ARCH: arm64
        run: ./scripts/docker_build.sh "${{ matrix.distro }}"

      - name: Smoke-test ${{ matrix.distro }} ARM64 container
        env:
          PRISM_ROS_ARCH: arm64
        run: ./scripts/docker_smoke_test.sh "${{ matrix.distro }}"

  rklocal-build:
    name: ARM64 RK-local ${{ matrix.distro }}
    needs: common-test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify RK-local SDK release files
        run: python3 third_party/Prism-SDK/scripts/test_all_examples.py --verify-only
      - name: Build RK-local container
        env:
          DOCKER_BUILDKIT: "1"
        run: bash scripts/docker_build_rklocal.sh "${{ matrix.distro }}"
      - name: Test actual SDK and ROS node with mock Agent
        run: |
          docker run --rm --platform linux/arm64 --network none \
            --mount "type=bind,src=$PWD/scripts,dst=/tests,readonly" \
            prism-ros-adapter:${{ matrix.distro }}-rklocal \
            python3 /tests/verify_rklocal_ros2.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [common-test, ros-build, ros-arm64-build, rklocal-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout adapter and SDK
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Package recursive source release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="Prism-ROS-adapter-${version}"
          mkdir -p "$RUNNER_TEMP/$package"
          tar --exclude-vcs --exclude='./build-*' -cf - . \
            | tar -C "$RUNNER_TEMP/$package" -xf -
          tar -C "$RUNNER_TEMP" -czf "$package.tar.gz" "$package"
          sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              Prism-ROS-adapter-*.tar.gz \
              Prism-ROS-adapter-*.tar.gz.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Prism ROS Adapter $GITHUB_REF_NAME" \
              --notes-file docs/update/v1.2.0.zh-CN.md
          else
            gh release create "$GITHUB_REF_NAME" \
              Prism-ROS-adapter-*.tar.gz \
              Prism-ROS-adapter-*.tar.gz.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Prism ROS Adapter $GITHUB_REF_NAME" --latest \
              --notes-file docs/update/v1.2.0.zh-CN.md
          fi
